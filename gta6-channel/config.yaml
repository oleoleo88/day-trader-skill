    - {name: "Google News: ГТА 6 (RU)", url: "https://news.google.com/rss/search?q=%22GTA+6%22+OR+%22%D0%93%D0%A2%D0%90+6%22+when:1d&hl=ru&gl=RU&ceid=RU:ru", tier: 3, lang: ru, focused: true, interval: 300}
