# ─────────────────────────────────────────────────────────────────────────────
#  Настройки канала. Секреты (токены, ID чатов) лежат в .env, здесь только поведение.
#  После правки перезапустите бота: docker compose restart
# ─────────────────────────────────────────────────────────────────────────────

channel:
  name: "GTA 6 | ГТА 6"            # подпись-ссылка в конце каждого поста
  timezone: "Europe/Moscow"        # все времена ниже указаны в этом поясе
  release_date: "2026-11-19"       # дата релиза (для обратного отсчёта и подсказок редактору)
  footer: true                     # добавлять подпись со ссылкой на канал
  source_link: true                # добавлять строку «Источник: …»
  hashtags: true                   # добавлять 1-3 рубрикационных хэштега
  category_label: true             # метка достоверности в начале поста (Официально / Слух / Утечка…)

# ── Публикация ───────────────────────────────────────────────────────────────
publishing:
  # auto   — всё, что прошло редактора, выходит без человека
  # hybrid — официальные и уверенные новости выходят сами, слухи/утечки/сомнительное идут на согласование
  # review — каждый пост ждёт кнопку «Опубликовать» в админ-чате
  mode: hybrid
  min_importance: 5                # важность по шкале 1-10; ниже порога новость отбрасывается
  breaking_importance: 9           # с этой важности пост выходит «молнией»: без очереди и тихих часов
  auto_categories: [official, media, industry, guide]   # что в режиме hybrid может выйти без согласования
  auto_min_confidence: 0.8         # минимальная уверенность редактора для автопубликации
  auto_min_tier: 2                 # источники не хуже этого уровня могут выходить сами (1 — официальные)
  max_posts_per_day: 14            # дневной лимит обычных постов (молнии и реклама не считаются)
  min_gap_minutes: 35              # минимальная пауза между обычными постами
  quiet_hours: [0, 8]              # с 00:00 до 08:00 обычные посты ждут утра; [] — без тихих часов
  silent_at_night: true            # молнии ночью выходят без звука
  stale_after_hours: 20            # новость, не вышедшая за это время, снимается с очереди
  review_ttl_hours: 36             # черновик без решения админа автоматически закрывается

# ── Сбор новостей ────────────────────────────────────────────────────────────
collector:
  poll_interval_sec: 150           # как часто опрашивать источники
  backfill_hours: 10               # при первом запуске брать новости не старше N часов
  max_age_hours: 48                # более старые записи игнорируются всегда
  min_source_chars: 350            # если текста источника меньше, пост идёт только на согласование
  dedupe_window_hours: 96          # окно поиска дублей
  title_similarity: 0.62           # порог схожести заголовков (0..1), выше — считаем дублем
  user_agent: "Mozilla/5.0 (compatible; NewsReaderBot/1.0)"
  # Запись из «общего» источника берётся в работу, только если в заголовке/анонсе есть одно из слов.
  # Источники с focused: true фильтр пропускают целиком.
  keywords:
    - "gta 6"
    - "gta vi"
    - "gta6"
    - "gtavi"
    - "grand theft auto 6"
    - "grand theft auto vi"
    - "гта 6"
    - "гта vi"
    - "гта6"
    - "rockstar"
    - "рокстар"
    - "take-two"
    - "take two"
    - "zelnick"
    - "зельник"
    - "vice city"
    - "вайс-сити"
    - "вайс сити"
    - "leonida"
    - "gta online"
    - "гта онлайн"
  # tier: 1 — официальный первоисточник, 2 — крупное издание, 3 — фан-сайты, инсайдеры, сообщества
  # Список проверяется командой `python -m gta6bot check` и в /sources; нерабочие ленты бот пометит сам.
  sources:
    - {name: "Rockstar Games (YouTube)", url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCuWcjpKbIDAbZfHoru1toFg", tier: 1, lang: en, focused: true, interval: 60}
    - {name: "Google News: Rockstar Newswire", url: "https://news.google.com/rss/search?q=site:rockstargames.com+%22Grand+Theft+Auto+VI%22+when:2d&hl=en-US&gl=US&ceid=US:en", tier: 1, lang: en, focused: true, interval: 120}
    - {name: "VGC", url: "https://www.videogameschronicle.com/feed/", tier: 2, lang: en}
    - {name: "IGN", url: "https://feeds.feedburner.com/ign/all", tier: 2, lang: en}
    - {name: "Eurogamer", url: "https://www.eurogamer.net/feed", tier: 2, lang: en}
    - {name: "GameSpot", url: "https://www.gamespot.com/feeds/mashup/", tier: 2, lang: en}
    - {name: "GamesRadar+", url: "https://www.gamesradar.com/rss/", tier: 2, lang: en}
    - {name: "PC Gamer", url: "https://www.pcgamer.com/rss/", tier: 2, lang: en}
    - {name: "Insider Gaming", url: "https://insider-gaming.com/feed/", tier: 2, lang: en}
    - {name: "Kotaku", url: "https://kotaku.com/rss", tier: 2, lang: en}
    - {name: "Polygon", url: "https://www.polygon.com/rss/index.xml", tier: 2, lang: en}
    - {name: "Rock Paper Shotgun", url: "https://www.rockpapershotgun.com/feed", tier: 2, lang: en}
    - {name: "RockstarINTEL", url: "https://rockstarintel.com/feed/", tier: 3, lang: en, focused: true}
    - {name: "GTA BOOM", url: "https://www.gtaboom.com/feed/", tier: 3, lang: en, focused: true}
    - {name: "Google News: GTA 6 (EN)", url: "https://news.google.com/rss/search?q=%22GTA+6%22+OR+%22GTA+VI%22+when:1d&hl=en-US&gl=US&ceid=US:en", tier: 3, lang: en, focused: true, interval: 300}
    - {name: "DTF", url: "https://dtf.ru/rss/all", tier: 2, lang: ru}
    - {name: "StopGame", url: "https://rss.stopgame.ru/rss_news.xml", tier: 2, lang: ru}
    - {name: "Игромания", url: "https://www.igromania.ru/rss/all.rss", tier: 2, lang: ru}
    - {name: "PlayGround", url: "https://www.playground.ru/rss/news.xml", tier: 2, lang: ru}
    - {name: "GameMag", url: "https://gamemag.ru/rss/feed", tier: 2, lang: ru}
    - {name: "Shazoo", url: "https://shazoo.ru/feed/rss", tier: 2, lang: ru}
