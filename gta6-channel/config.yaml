# ── ИИ (Claude API) ──────────────────────────────────────────────────────────
llm:
  # По умолчанию всё работает на Claude Opus 5.5 — максимум качества.
  # Чтобы удешевить фоновые задачи примерно в 40 раз, поставьте для triage и moderation
  # модель claude-haiku-5-5 (посты при этом по-прежнему пишет Opus).
  models:
    triage: claude-opus-5-5        # оценка важности и поиск дублей
    writer: claude-opus-5-5        # написание постов
    moderation: claude-opus-5-5    # ИИ-судья в комментариях
    qa: claude-opus-5-5            # ответы на вопросы (/ask)
    poll: claude-opus-5-5          # опросы и викторины
  effort:                          # low | medium | high | xhigh | max
    triage: low
    writer: medium
    moderation: low
    qa: low
    poll: medium
  refusal_fallback: true           # если защитный классификатор отклонил запрос, API сам повторит его на запасной модели
  timeout_sec: 120
  max_concurrency: 4

# ── Модерация комментариев ───────────────────────────────────────────────────
moderation:
  enabled: true
  first_comment: true              # бот оставляет первый комментарий под каждым постом
  first_comment_text: |
    💬 Обсуждаем здесь. Коротко о правилах: без спама, рекламы и оскорблений. Сюжетные спойлеры прячем под скрытый текст.
    Нашли новость раньше нас? Пришлите её боту: {bot_link}
  rules_text: |
    <b>Правила комментариев</b>
    1. Без рекламы, ссылок-приглашений и «заработка».
    2. Без оскорблений и травли. Спорим о GTA, а не друг о друге.
    3. Сюжетные спойлеры только под скрытым текстом.
    4. Политика и оффтоп вне игры удаляются.
    Нарушения: предупреждение → мут → бан. Спам-боты банятся сразу.
  delete_service_messages: true    # удалять «вступил/вышел»
  block_channel_senders: true      # удалять комментарии от имени чужих каналов (частый канал спама)
  links:
    policy: newcomers              # off — не трогать; newcomers — резать у новичков; all — резать у всех
    newcomer_messages: 15          # пока у человека меньше стольких сообщений, он «новичок»
    allow_domains: [rockstargames.com, youtube.com, youtu.be, reddit.com, x.com, twitter.com, twitch.tv,
                    playstation.com, xbox.com, store.playstation.com, dtf.ru, ign.com, t.me]
    block_invites: true            # t.me/+…, joinchat и @упоминания чужих каналов режутся у всех
  flood:
    messages: 6                    # больше N сообщений…
    per_seconds: 12                # …за T секунд — мут
    mute_minutes: 15
    duplicates: 3                  # одно и то же сообщение N раз за 2 минуты — удаление и предупреждение
  max_custom_emoji: 12             # больше — подозрение на спам премиум-эмодзи
  profanity: off                   # off | delete | warn  (GTA — игра 18+, по умолчанию мат не трогаем)
  # Жёсткие фразы: сообщение удаляется сразу, новичок получает бан, остальные — предупреждение.
  hard_phrases:
    - "заработок от"
    - "заработок в интернете"
    - "доход от"
    - "пассивный доход"
    - "без вложений"
    - "пиши в лс"
    - "пишите в лс"
    - "пиши в личку"
    - "пишите в личку"
    - "пишите в личные"
    - "ищу людей"
    - "ищем людей"
    - "нужны люди"
    - "удаленная работа"
    - "удаленный заработок"
    - "подработка"
    - "темка"
    - "арбитраж"
    - "инвестиц"
    - "казино"
    - "1xbet"
    - "1win"
    - "ставки на спорт"
    - "фрибет"
    - "onlyfans"
    - "интим"
    - "эскорт"
    - "закладк"
    - "накрутка"
    - "раскрутка канала"
    - "airdrop"
    - "free nitro"
    - "бесплатные v-bucks"
  # Мягкие фразы: не удаляем сразу, а отдаём ИИ-судье (или пропускаем, если судья выключен).
  soft_phrases:
    - "крипт"
    - "биткоин"
    - "usdt"
    - "промокод"
    - "скидк"
    - "продам"
    - "куплю"
    - "аккаунт"
    - "ключи"
    - "подпишись"
    - "подписывайтесь"
    - "мой канал"
    - "в профиле"
    - "в био"
    - "ссылка в"
    - "переходи"
    - "бесплатно"
    - "розыгрыш"
    - "взлом"
    - "чит"
    - "сдохни"
    - "убью"
    - "убей себя"
  llm_judge:
    enabled: true
    scrutiny_messages: 2           # первые N сообщений каждого нового комментатора проверяет ИИ
    min_chars: 12                  # совсем короткие реплики ИИ не показываем
    min_confidence: 0.75           # ниже — сообщение остаётся
    daily_limit: 600               # потолок обращений к ИИ-судье в сутки (защита бюджета)
    spoiler_guard: true            # удалять сюжетные спойлеры без скрытого текста
    politics: delete               # delete | ignore — оффтоп-политика
  # Лестница наказаний: номер предупреждения → действие
  ladder: ["warn", "mute:60", "mute:1440", "ban"]
  warn_ttl_days: 30                # предупреждения сгорают через N дней
  notice_ttl_sec: 30               # через сколько секунд бот убирает свои служебные реплики
  log_deletions: true              # присылать в админ-чат сводку удалённого (видно ложные срабатывания)

# ── Рубрики ──────────────────────────────────────────────────────────────────
rubrics:
  countdown: {enabled: true, time: "10:00"}                  # «До релиза N дней», пока дата не наступила
  digest: {enabled: true, time: "21:30", min_posts: 4}       # «Главное за день» со ссылками на посты
  poll: {enabled: true, weekday: 5, time: "18:00"}           # опрос/викторина раз в неделю (0 — пн … 6 — вс)
  weekly_report: {enabled: true, weekday: 0, time: "10:30"}  # отчёт админу

# ── Сообщество ───────────────────────────────────────────────────────────────
community:
  suggestions: true                # «предложка» в личке бота
  ad_inquiries: true               # приём рекламных заявок через бота
  qa: true                         # /ask — ИИ отвечает на вопросы по базе фактов
  qa_per_user_per_day: 8
  qa_daily_limit: 300

# ── Реклама ──────────────────────────────────────────────────────────────────
ads:
  default_top_minutes: 60          # сколько рекламный пост держится последним в ленте
  default_feed_hours: 24           # через сколько удаляется (0 — не удалять)
  breaking_overrides_top: false    # может ли «молния» перебить рекламный «топ»
  require_erid: true               # предупреждать, если пост создаётся без erid

# ── Аналитика ────────────────────────────────────────────────────────────────
analytics:
  scrape_views: true               # читать просмотры постов с публичной страницы t.me/s/<канал>
  rkn_reminder: true               # напомнить о реестре РКН при подходе к 10 000 подписчиков
