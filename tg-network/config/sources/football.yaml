# Источники футбольного пакета.
# tier: 1 – официальные (клубы, лиги, федерации), 2 – крупные СМИ, 3 – инсайдеры/агрегаторы.
# group: «группа независимости». Два материала одной группы считаются одним подтверждением.
# ПЕРЕД ЗАПУСКОМ: python -m tgnet sources – проверит каждый адрес. Нерабочие выключи (enabled: false).
pack: football

sources:
  # --- Крупные англоязычные СМИ (T2)
  - {id: bbc_football, name: BBC Sport, kind: rss, url: "https://feeds.bbci.co.uk/sport/football/rss.xml", tier: 2, group: bbc, lang: en}
  - {id: guardian_football, name: The Guardian, kind: rss, url: "https://www.theguardian.com/football/rss", tier: 2, group: guardian, lang: en}
  - {id: sky_football, name: Sky Sports, kind: rss, url: "https://www.skysports.com/rss/12040", tier: 2, group: sky, lang: en}
  - {id: espn_soccer, name: ESPN, kind: rss, url: "https://www.espn.com/espn/rss/soccer/news", tier: 2, group: espn, lang: en}

  # --- Русскоязычные СМИ (T2). Адреса RSS сверь командой sources и поправь при необходимости.
  - {id: championat_football, name: Чемпионат, kind: rss, url: "https://www.championat.com/rss/news/football/", tier: 2, group: championat, lang: ru}
  - {id: sportexpress_football, name: Спорт-Экспресс, kind: rss, url: "https://www.sport-express.ru/services/materials/news/football/se/", tier: 2, group: sportexpress, lang: ru}
  - {id: sportsru_football, name: Sports.ru, kind: rss, url: "https://www.sports.ru/rss/rubric.xml?s=208", tier: 2, group: sportsru, lang: ru}

  # --- Официальные Telegram-каналы (T1). Впиши проверенные @username официальных каналов клубов/лиг
  #     (галочка верификации или ссылка с официального сайта!) и включи enabled: true.
  - {id: tg_official_example, name: "Официальный канал клуба", kind: telegram, url: "https://t.me/OFFICIAL_HANDLE", tier: 1, group: official_example, lang: ru, interval_min: 3, enabled: false}

  # --- Инсайдеры (T3): публикуются только как «Слух» с атрибуцией и через твоё одобрение.
  - {id: tg_insider_example, name: "Инсайдер", kind: telegram, url: "https://t.me/INSIDER_HANDLE", tier: 3, group: insider_example, lang: en, interval_min: 3, enabled: false}

