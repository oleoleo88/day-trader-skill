id: football_ru
enabled: true
title: "Футбол | Главное"
chat_id: ${FOOTBALL_CHAT_ID}                 # @username или -100… ; бот – админ с правом публикации
username: ${FOOTBALL_USERNAME}               # публичный @username без @ (для статистики просмотров)
discussion_chat_id: ${FOOTBALL_DISCUSSION_ID} # группа комментариев (-100…); бот – админ с правом удаления/бана
packs: [football]
language: ru

autonomy: approve        # approve – всё через тебя; auto – подтверждённое сам, слухи через тебя; manual – только черновики
auto_confidence: 0.88
triage_threshold: 62
max_selected_per_cycle: 4
images: true

focus: >
  Топ-футбол для русскоязычной аудитории: АПЛ, Ла Лига, Серия А, Бундеслига, Лига 1, РПЛ,
  Лига чемпионов, Лига Европы, сборные (ЧМ, Евро). Трансферы, официальные заявления, результаты
  больших матчей, увольнения тренеров, травмы звёзд. Не берём: низшие дивизионы, женский футбол
  (если не сенсация), ставки, светскую хронику.
exclude_keywords: [ставк, коэффициент, прогноз на матч, betting, odds]

voice: |
  Уверенный, живой, без канцелярита и без кликбейта. Как хороший спортивный журналист, а не паблик.
  Коротко и по делу: читатель за 10 секунд понимает суть. Без эмодзи-мусора – максимум 1–2 по смыслу.
  Никаких оценок «легенда», «шок», «сенсация» – пусть говорят факты.

format_rules: |
  - Первая строка – суть новости жирным (<b>…</b>), до 90 символов. Можно 1 эмодзи в начале по теме (⚽️ 🔁 🩹 🏆 📝).
  - Дальше 1–3 коротких абзаца: детали (суммы, сроки, счёт, авторы голов), контекст из факт-листа, цитата в <blockquote>, если есть.
  - Для статуса reported/rumor источник указывается в тексте («по данным The Athletic»).
  - Без хештегов. Без ссылок, кроме источника в конце, если это уместно: <a href="…">Источник</a>.
  - Длина 250–700 символов. Сухие результаты можно короче.

signature: ""            # например: <a href="https://t.me/your_channel">Футбол | Главное</a>

forbidden_phrases: []

schedule:
  quiet_hours: "01:30-07:30"   # ночью не публикуем (кроме срочного)
  min_interval_min: 20
  max_posts_per_day: 22
  breaking_score: 90
  max_age_hours: 8
  approval_ttl_hours: 5

verification:
  allow_rumors: true           # слухи только с пометкой и атрибуцией и только через тебя
  independent_confirmations: 2 # без официального источника нужно 2 независимых крупных СМИ
  max_item_age_hours: 24
  recheck_minutes: 10
  recheck_window_hours: 3
  use_grounding: true          # дополнительная проверка через Google Search (Gemini), только белый список доменов

moderation:
  enabled: true
  use_llm: true
  trust_after_messages: 5
  trust_after_hours: 24
  flood_messages: 5
  flood_seconds: 20
  strikes_mute: 2
  strikes_ban: 3
  mute_hours: 24
  stop_words: []               # добавь названия конкурирующих БК, если не хочешь чужую рекламу в комментах

specialists:
  - name: football_daily_digest
    title: "Итоги дня"
    purpose: "Вечерний пост с главными событиями дня в канале"
    schedule: {daily_at: "22:40"}
    lookback_hours: 16
    min_posts: 5
    score: 75
    instructions: |
      Пост «⚽️ Главное за день»: 5–8 пунктов, каждый – одна строка с сутью новости, самое важное сверху.
      Перед списком одна вводная фраза. Без повторов. В конце ничего не добавляй.

